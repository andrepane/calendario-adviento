<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111d29">
  <title>Diciembre para Cintia</title>
  <link rel="stylesheet" href="./estilos.css">
  <script defer src="./escape-room.js"></script>
  <script defer src="./calendario-publicado.js"></script>
  <script defer src="./vista-reto.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <section id="portada" aria-labelledby="dedicatoria">
      <div class="sobre">
        <div class="sobre-luz" aria-hidden="true"></div>
        <div class="sobre-carta" aria-hidden="true"></div>
        <div class="sobre-pliegues" aria-hidden="true"></div>
        <div class="sobre-solapa" aria-hidden="true"></div>
        <div class="sobre-frente">
          <span class="sello" aria-hidden="true">✶</span>
          <h1 id="dedicatoria">Para Cintia</h1>
          <p class="fecha">DICIEMBRE 2026</p>
        </div>
      </div>
      <button id="abrir" class="boton" type="button">Abrir el sobre <span aria-hidden="true">↗</span></button>
    </section>

    <section id="calendario" aria-labelledby="titulo-calendario" hidden>
      <header class="introduccion">
        <p class="fecha"><span aria-hidden="true">✶</span> Calendario de Adviento</p>
        <h1 id="titulo-calendario" tabindex="-1">Diciembre<br><em>para Cintia.</em></h1>
        <p id="mensaje"></p>
        <ul class="leyenda" aria-label="Estados de las puertas">
          <li><span class="marca destacada" aria-hidden="true"></span> Reto disponible</li>
          <li><span class="marca abierta" aria-hidden="true">↺</span> Abierta sin resolver</li>
          <li><span class="marca resuelta" aria-hidden="true">✓</span> Reto resuelto</li>
          <li><span class="marca futura" aria-hidden="true">—</span> Falta la fecha</li>
          <li><span class="marca sin-llave" aria-hidden="true">◇</span> Falta la llave</li>
        </ul>
        <button class="boton" id="abrir-cuaderno" type="button" aria-haspopup="dialog">Cuaderno</button>
      </header>

      <div class="escena">
        <div class="luna" aria-hidden="true"></div>
        <div class="casa">
          <div class="tejado" aria-hidden="true">
            <span class="chimenea"></span>
            <div class="fronton"><span></span></div>
          </div>
          <div class="fachada">
            <div id="puertas" class="puertas" role="group" aria-label="Puertas del calendario"></div>
          </div>
          <div class="escalones" aria-hidden="true"></div>
        </div>
        <div class="abeto abeto-izquierdo" aria-hidden="true"></div>
        <div class="abeto abeto-derecho" aria-hidden="true"></div>
        <div class="suelo" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <dialog id="sorpresa" aria-labelledby="titulo">
    <span class="limite-foco" id="inicio-tarjeta" tabindex="0"></span>
    <form class="barra-tarjeta" method="dialog">
      <p id="dia" class="fecha"></p>
      <button class="cerrar" aria-label="Cerrar sorpresa" autofocus>×</button>
    </form>
    <h2 id="titulo"></h2>
    <div id="contenido"></div>
    <span class="limite-foco" id="fin-tarjeta" tabindex="0"></span>
  </dialog>

  <dialog id="cuaderno" aria-labelledby="titulo-cuaderno">
    <span class="limite-foco" tabindex="0"></span>
    <form class="barra-tarjeta" method="dialog">
      <span class="fecha">Evidencias ganadas</span>
      <button class="cerrar" aria-label="Cerrar cuaderno" autofocus>×</button>
    </form>
    <h2 id="titulo-cuaderno">Cuaderno</h2>
    <div id="tarjetas-cuaderno"></div>
    <span class="limite-foco" tabindex="0"></span>
  </dialog>
</body>
</html>
